services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - '4000:4000'
    environment:
      PORT: 4000
      FRONTEND_URL: http://localhost:5173
      DATABASE_PATH: /app/backend/data/downloads.sqlite
      YT_DLP_PATH: yt-dlp
      FFMPEG_PATH: ffmpeg
    volumes:
      - ./backend/data:/app/backend/data
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - '5173:5173'
    depends_on:
      - backend
